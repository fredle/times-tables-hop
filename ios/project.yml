# XcodeGen spec. CI runs `xcodegen generate` to produce TimesTablesHop.xcodeproj,
# so no .xcodeproj is checked in (and none has to be made on a Mac).
# MARKETING_VERSION is set by app-factory release; Apple picks build numbers.
name: TimesTablesHop
options:
  bundleIdPrefix: net.leatham
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: R53MF3F498
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # iPhone only: a portrait-only app that also targets iPad is rejected on upload.
    TARGETED_DEVICE_FAMILY: "1"
targets:
  TimesTablesHop:
    type: application
    platform: iOS
    sources:
      - App
      # The web game itself, shared with the browser version: copied into the
      # app bundle as a folder called "public".
      - path: ../public
        type: folder
        buildPhase: resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Times Tables Hop
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Opts out of iPad multitasking, so a portrait-only list is accepted.
        UIRequiresFullScreen: true
        # Standard HTTPS only: skips the per-build "Missing Compliance" question.
        ITSAppUsesNonExemptEncryption: false
        # Where the grown-ups' feedback sheet sends notes (Feedback.swift).
        FeedbackURL: "https://feedback.leatham.net/v1/feedback"
        NSMicrophoneUsageDescription: Times Tables Hop listens for your spoken answers while you play.
        NSSpeechRecognitionUsageDescription: Times Tables Hop turns your spoken answers into numbers so the frog can hop.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.leatham.timestableshop
        # Repeats the project-level "1": XcodeGen's iOS preset sets "1,2" at
        # target level, which overrides the project setting and makes a
        # portrait-only universal build that App Store Connect rejects (90474).
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
